<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil - Gestion de Présence</title>
<style>
    /* Reset de base */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body, html {
        height: 100%;
        font-family: Arial, sans-serif;
        background: url('https://images.unsplash.com/photo-1581090700227-1ec0b83249a2?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
        background-size: cover;
        color: white;
        padding-bottom: 60px; /* espace pour le footer fixe */
    }

    /* Overlay sombre pour lisibilité */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: -1;
    }

    header {
        background-color: rgba(0, 68, 204, 0.85);
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 {
        margin: 0;
        font-size: 2.8em;
        color: white;
        letter-spacing: 1px;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
    }

    nav a {
        text-decoration: none;
        color: white;
        font-weight: bold;
        padding: 12px 25px;
        border-radius: 8px;
        background-color: rgba(0,68,204,0.8);
        transition: 0.3s;
    }

    nav a:hover {
        background-color: white;
        color: #0044cc;
        transform: scale(1.05);
    }

    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 50px 20px;
        min-height: calc(100vh - 140px); /* header + footer */
    }

    .welcome-card {
        background-color: rgba(255,255,255,0.9);
        color: #0044cc;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        max-width: 800px;
        width: 100%;
        animation: fadeIn 1s ease-in-out;
    }

    .welcome-card h2 {
        font-size: 2em;
        margin-bottom: 20px;
    }

    .buttons-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 30px;
    }

    .buttons-group a {
        text-decoration: none;
        background-color: #0044cc;
        color: white;
        padding: 12px 30px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }

    .buttons-group a:hover {
        background-color: #003399;
        transform: scale(1.05);
    }

    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        text-align: center;
        padding: 15px;
        background-color: rgba(0, 68, 204, 0.85);
        color: white;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 600px) {
        .welcome-card h2 {
            font-size: 1.5em;
        }
        .buttons-group a {
            padding: 10px 20px;
        }
    }
</style>
</head>
<body>

<header>
    <h1>Gest-Pre-Etu</h1>
</header>

<nav>
    <a href="login.html">Connexion</a>
</nav>

<main>
    <div class="welcome-card">
        <h2>Bienvenue dans l'application de gestion de présence</h2>
        <p>Gérez vos étudiants, professeurs, cours et prises de présence facilement depuis un seul endroit.</p>
    </div>
</main>

<footer>
    &copy;  2025 Université - Tous droits réservés
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
    console.log("Bienvenue sur l'application de gestion de présence !");
});
</script>

</body>
</html>
